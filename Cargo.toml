[package]
name = "os"
version = "0.1.1"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]

[dependencies]
log = "0.4.21"
env_logger = "0.11.3"

serde = {version="1.0.216", features=["derive"]}
rusqlite = {version="0.32.1",features=["vtab"]}
mlua = {version="0.10.0", features=["luajit", "vendored", "macros"]}
chrono = "0.4.39"
notify = "7.0.0"
notify-debouncer-full = "0.4.0"
